version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rfp-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfp-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - APP_ENV=production
    env_file:
      - .env
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfp-frontend
    restart: always
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api

volumes:
  qdrant_data:
    driver: local
