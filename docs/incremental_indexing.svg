<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .box { rx: 8; ry: 8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="700" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <text x="40" y="40" class="title">RFP Intelligence Platform — Incremental Indexing Engine</text>
  <text x="40" y="62" class="subtitle">Content-Addressed SHA-256 Fingerprinting &amp; Zero-Redundant State Synchronization</text>

  <!-- Step 1: Bid Folder Ingestion -->
  <rect x="40" y="250" width="170" height="130" class="box" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="250" width="170" height="24" rx="8" fill="#1e293b"/>
  <rect x="40" y="266" width="170" height="8" fill="#1e293b"/>
  <text x="50" y="267" class="badge">1. DISCOVERY</text>
  <text x="50" y="295" class="box-title">Bid Folder Scan</text>
  <text x="50" y="315" class="box-desc">• PDF, HTML, TXT docs</text>
  <text x="50" y="333" class="box-desc">• Recursive file discovery</text>
  <text x="50" y="351" class="box-desc">• Multi-bid folder watch</text>

  <!-- Flow to Fingerprinting -->
  <line x1="210" y1="315" x2="250" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Fingerprinting & Registry Comparison -->
  <rect x="250" y="240" width="220" height="150" class="box" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="250" y="240" width="220" height="24" rx="8" fill="#4338ca"/>
  <rect x="250" y="256" width="220" height="8" fill="#4338ca"/>
  <text x="260" y="257" class="badge">2. FINGERPRINT &amp; REGISTRY</text>
  <text x="260" y="285" class="box-title">SHA-256 Hasher</text>
  <text x="260" y="305" class="box-desc">• Compute hash for each file</text>
  <text x="260" y="323" class="box-desc">• Compare vs registry/manifest</text>
  <text x="260" y="341" class="box-desc">• Detect additions / edits / purges</text>
  <text x="260" y="359" class="box-desc">• Atomic manifest lock</text>

  <!-- Branching Connectors -->
  <path d="M 470 315 L 510 315 L 510 115 L 540 115" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 470 315 L 510 315 L 510 245 L 540 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 470 315 L 510 315 L 510 385 L 540 385" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 470 315 L 510 315 L 510 515 L 540 515" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <!-- Branch 1: NEW FILE -->
  <rect x="540" y="70" width="240" height="90" class="box" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="555" y="95" class="box-title" fill="#065f46">BRANCH: NEW FILE</text>
  <text x="555" y="115" class="box-desc">• Parse PDF / OCR fallback</text>
  <text x="555" y="132" class="box-desc">• Extract chunks &amp; metadata</text>
  <text x="555" y="149" class="box-desc">• Embed &amp; index into stores</text>

  <!-- Branch 2: UNCHANGED FILE -->
  <rect x="540" y="200" width="240" height="90" class="box" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="555" y="225" class="box-title" fill="#475569">BRANCH: UNCHANGED</text>
  <text x="555" y="245" class="box-desc">• Hash matches registry</text>
  <text x="555" y="262" class="box-desc">• Zero embedding API calls</text>
  <text x="555" y="279" class="box-desc">• Instant bypass / no-op</text>

  <!-- Branch 3: MODIFIED FILE -->
  <rect x="540" y="340" width="240" height="90" class="box" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="555" y="365" class="box-title" fill="#92400e">BRANCH: MODIFIED</text>
  <text x="555" y="385" class="box-desc">• Delete outdated chunk points</text>
  <text x="555" y="402" class="box-desc">• Re-parse &amp; re-chunk file</text>
  <text x="555" y="419" class="box-desc">• Re-embed &amp; update indexes</text>

  <!-- Branch 4: DELETED FILE -->
  <rect x="540" y="470" width="240" height="90" class="box" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="555" y="495" class="box-title" fill="#9f1239">BRANCH: DELETED / PURGED</text>
  <text x="555" y="515" class="box-desc">• Detect missing file in scan</text>
  <text x="555" y="532" class="box-desc">• Atomic payload purge in Qdrant</text>
  <text x="555" y="549" class="box-desc">• Invalidate BM25 corpus entries</text>

  <!-- Re-converge to Target Storage Layer -->
  <path d="M 780 115 L 820 115 L 820 315 L 850 315" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 780 385 L 820 385 L 820 315 L 850 315" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 780 515 L 820 515 L 820 315 L 850 315" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: Synced Stores & Registry -->
  <rect x="850" y="210" width="250" height="210" class="box" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="850" y="210" width="250" height="24" rx="8" fill="#2563eb"/>
  <rect x="850" y="226" width="250" height="8" fill="#2563eb"/>
  <text x="860" y="227" class="badge">3. SYNCHRONIZED STORAGE</text>
  <text x="865" y="255" class="box-title" fill="#1e40af">Updated Storage Layer</text>

  <rect x="865" y="270" width="220" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="875" y="288" class="box-title" font-size="12">Qdrant Vector DB</text>
  <text x="875" y="302" class="box-desc">Upserted / purged payload points</text>

  <rect x="865" y="318" width="220" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="875" y="336" class="box-title" font-size="12">BM25 Sparse Index</text>
  <text x="875" y="350" class="box-desc">Serialized token frequency index</text>

  <rect x="865" y="366" width="220" height="40" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="875" y="384" class="box-title" font-size="12">outputs/registry/manifest.json</text>
  <text x="875" y="398" class="box-desc">Synced SHA-256 fingerprint state</text>

  <!-- Bottom Efficiency Box -->
  <rect x="40" y="600" width="1060" height="65" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="625" class="box-title" font-size="13" fill="#0f172a">⚡ Efficiency Guarantee</text>
  <text x="60" y="645" class="box-desc">Re-running the ingestion pipeline on identical bid files executes in &lt; 0.1s with 0 API tokens consumed, preventing duplicate chunk generation and embedding API waste.</text>

</svg>
