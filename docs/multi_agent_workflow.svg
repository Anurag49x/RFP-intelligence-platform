<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .box { rx: 8; ry: 8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .decision { stroke-dasharray: 4,4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="720" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <text x="40" y="40" class="title">RFP Intelligence Platform — Multi-Agent Extraction Graph</text>
  <text x="40" y="62" class="subtitle">LangGraph State Machine: Orchestrator → Domain Specialists → Addendum Reconciler → Critic/Validator → Self-Healing Loop</text>

  <!-- Step 1: Orchestrator -->
  <rect x="40" y="240" width="160" height="140" class="box" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="240" width="160" height="24" rx="8" fill="#1e293b"/>
  <rect x="40" y="256" width="160" height="8" fill="#1e293b"/>
  <text x="50" y="257" class="badge">ORCHESTRATOR</text>
  <text x="50" y="285" class="box-title">State Coordinator</text>
  <text x="50" y="305" class="box-desc">• Inits RFPState</text>
  <text x="50" y="325" class="box-desc">• Dispatches tasks</text>
  <text x="50" y="345" class="box-desc">• Parallel fan-out</text>
  <text x="50" y="365" class="box-desc">• Convergence sync</text>

  <!-- Fan-out connectors -->
  <path d="M 200 310 L 235 310 L 235 125 L 260 125" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 200 310 L 235 310 L 235 245 L 260 245" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 200 310 L 235 310 L 235 375 L 260 375" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 200 310 L 235 310 L 235 505 L 260 505" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Specialist 1: Entity -->
  <rect x="260" y="80" width="220" height="90" class="box" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="275" y="105" class="box-title" fill="#1e40af">Entity Specialist</text>
  <text x="275" y="125" class="box-desc">• Bid Number, Title</text>
  <text x="275" y="142" class="box-desc">• Company Name, Buyer POC</text>
  <text x="275" y="159" class="box-desc">• Contract / Coop Vehicle</text>

  <!-- Specialist 2: Logistics -->
  <rect x="260" y="200" width="220" height="90" class="box" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="275" y="225" class="box-title" fill="#1e40af">Logistics Specialist</text>
  <text x="275" y="245" class="box-desc">• Due Date &amp; Submission Type</text>
  <text x="275" y="262" class="box-desc">• Pre-Bid Meeting &amp; Delivery</text>
  <text x="275" y="279" class="box-desc">• Term of Bid &amp; Installation</text>

  <!-- Specialist 3: Product -->
  <rect x="260" y="330" width="220" height="90" class="box" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="275" y="355" class="box-title" fill="#1e40af">Product Specialist</text>
  <text x="275" y="375" class="box-desc">• Product Name &amp; Model No</text>
  <text x="275" y="392" class="box-desc">• Part Numbers &amp; MFG Spec</text>
  <text x="275" y="409" class="box-desc">• Technical Configurations</text>

  <!-- Specialist 4: Legal & Compliance -->
  <rect x="260" y="460" width="220" height="90" class="box" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="275" y="485" class="box-title" fill="#1e40af">Legal Specialist</text>
  <text x="275" y="505" class="box-desc">• Bid Bond &amp; Payment Terms</text>
  <text x="275" y="522" class="box-desc">• Required Affidavits &amp; Forms</text>
  <text x="275" y="539" class="box-desc">• M/WBE &amp; Additional Docs</text>

  <!-- Fan-in to Shared RFPState -->
  <path d="M 480 125 L 515 125 L 515 310 L 535 310" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 480 245 L 515 245 L 515 310 L 535 310" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 480 375 L 515 375 L 515 310 L 535 310" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 480 505 L 515 505 L 515 310 L 535 310" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Shared RFPState -->
  <rect x="535" y="240" width="130" height="140" class="box" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
  <text x="545" y="270" class="box-title" font-size="13" fill="#4338ca">Shared RFPState</text>
  <text x="545" y="295" class="box-desc">• 20-field schema</text>
  <text x="545" y="315" class="box-desc">• Raw citations</text>
  <text x="545" y="335" class="box-desc">• Confidence logs</text>
  <text x="545" y="355" class="box-desc">• Retry counter</text>

  <!-- Flow to Addendum Reconciler -->
  <line x1="665" y1="310" x2="705" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 5: Addendum Reconciler -->
  <rect x="705" y="250" width="160" height="120" class="box" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="715" y="275" class="box-title" fill="#92400e">Addendum Reconciler</text>
  <text x="715" y="298" class="box-desc">• Scans addenda dates</text>
  <text x="715" y="318" class="box-desc">• Supersedes deadlines</text>
  <text x="715" y="338" class="box-desc">• Overrides modifications</text>
  <text x="715" y="358" class="box-desc">• Tracks provenance diff</text>

  <!-- Flow to Validator / Critic -->
  <line x1="865" y1="310" x2="905" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 6: Validator / Critic -->
  <rect x="905" y="240" width="180" height="140" class="box" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="905" y="240" width="180" height="24" rx="8" fill="#8b5cf6"/>
  <rect x="905" y="256" width="180" height="8" fill="#8b5cf6"/>
  <text x="915" y="257" class="badge">VALIDATOR / CRITIC</text>
  <text x="915" y="285" class="box-title" fill="#581c87">Field Hallucination Check</text>
  <text x="915" y="305" class="box-desc">• Verified passage quote</text>
  <text x="915" y="325" class="box-desc">• Format integrity checks</text>
  <text x="915" y="345" class="box-desc">• Null on missing facts</text>
  <text x="915" y="365" class="box-desc">• Pass/Fail evaluation</text>

  <!-- PASS Branch to Serializer -->
  <path d="M 995 380 L 995 590 L 870 590" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="940" y="440" width="90" height="26" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="955" y="457" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">PASS ✓</text>

  <!-- Serializer -->
  <rect x="670" y="545" width="200" height="90" class="box" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="685" y="575" class="box-title" fill="#065f46">Canonical Serializer</text>
  <text x="685" y="595" class="box-desc">Outputs 20-field JSON with</text>
  <text x="685" y="612" class="box-desc">value, sources, confidence, notes</text>

  <!-- FAIL Branch to Retry Agent -->
  <path d="M 995 240 L 995 125 L 870 125" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="935" y="160" width="100" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="945" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">FAIL (Max 2) ✗</text>

  <!-- Retry Agent -->
  <rect x="670" y="80" width="200" height="90" class="box" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="685" y="105" class="box-title" fill="#9f1239">Retry Agent</text>
  <text x="685" y="125" class="box-desc">• Formulates targeted query</text>
  <text x="685" y="142" class="box-desc">• Fetches extra context</text>
  <text x="685" y="159" class="box-desc">• Resubmits to Critic</text>

  <!-- Retry loop back to Validator -->
  <path d="M 670 125 L 610 125 L 610 240" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>

</svg>
